description: Open Bionics is a Bristol, UK-based medical technology company that designs
  and manufactures advanced multi-grip bionic arms for children and adults with upper-limb
  differences. Its Hero product family (Hero ARM, Hero PRO, Hero RGD, Hero FLEX and
  Hero GAUNTLET) pairs 3D-printed, lightweight myoelectric prosthetic hands with an
  ecosystem of MyoPods wireless electrodes and the Sidekick companion app, delivered
  through a network of specialist prosthetists and clinics in the US and UK. Added
  to the API Evangelist network as a Techstars portfolio company; enrichment probing
  found no public developer API, SDK, developer portal, or event surface.
